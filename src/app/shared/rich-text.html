<div class="flex flex-wrap gap-1" role="toolbar" [attr.aria-label]="locale.t('rich.formatting')">
  <button
    type="button"
    class="rounded-lg border px-2.5 py-1 text-sm font-bold"
    [class.border-gold-300]="marks().bold"
    [class.bg-gold-400/10]="marks().bold"
    [class.border-gold-300/40]="!marks().bold"
    [attr.aria-pressed]="marks().bold"
    [disabled]="disabled()"
    (mousedown)="keepSelection($event)"
    (click)="format('bold')"
  >
    {{ locale.t('rich.bold') }}
  </button>
  <button
    type="button"
    class="rounded-lg border px-2.5 py-1 text-sm italic"
    [class.border-gold-300]="marks().italic"
    [class.bg-gold-400/10]="marks().italic"
    [class.border-gold-300/40]="!marks().italic"
    [attr.aria-pressed]="marks().italic"
    [disabled]="disabled()"
    (mousedown)="keepSelection($event)"
    (click)="format('italic')"
  >
    {{ locale.t('rich.italic') }}
  </button>
  <button
    type="button"
    class="rounded-lg border px-2.5 py-1 text-sm underline"
    [class.border-gold-300]="marks().underline"
    [class.bg-gold-400/10]="marks().underline"
    [class.border-gold-300/40]="!marks().underline"
    [attr.aria-pressed]="marks().underline"
    [disabled]="disabled()"
    (mousedown)="keepSelection($event)"
    (click)="format('underline')"
  >
    {{ locale.t('rich.underline') }}
  </button>
  <button
    type="button"
    class="rounded-lg border border-gold-300/40 px-2.5 py-1 text-sm"
    [disabled]="disabled()"
    (mousedown)="keepSelection($event)"
    (click)="format('insertUnorderedList')"
  >
    {{ locale.t('rich.bullets') }}
  </button>
  <button
    type="button"
    class="rounded-lg border border-gold-300/40 px-2.5 py-1 text-sm"
    [disabled]="disabled()"
    (mousedown)="keepSelection($event)"
    (click)="format('insertOrderedList')"
  >
    {{ locale.t('rich.numbers') }}
  </button>
  <button
    type="button"
    class="rounded-lg border border-gold-300/40 px-2.5 py-1 text-sm"
    [disabled]="disabled()"
    [attr.aria-expanded]="linkOpen()"
    (mousedown)="keepSelection($event)"
    (click)="openLink()"
  >
    {{ locale.t('rich.link') }}
  </button>
</div>

@if (linkOpen()) {
  <div class="flex flex-wrap items-center gap-2">
    <label class="sr-only" for="rich-link">{{ locale.t('field.linkAddress') }}</label>
    <input
      #linkInput
      id="rich-link"
      class="field w-full min-w-0 flex-1 sm:min-w-56"
      type="url"
      [value]="linkUrl()"
      (input)="linkUrl.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault(); applyLink()"
    />
    <button type="button" class="btn btn-gold" (click)="applyLink()">{{ locale.t('action.addLink') }}</button>
    <button type="button" class="btn btn-line" (click)="cancelLink()">{{ locale.t('action.cancel') }}</button>
  </div>
  @if (linkError()) {
    <p class="text-sm text-red-200" role="alert">{{ linkError() }}</p>
  }
}

<div
  #editor
  class="field rich-text min-h-48"
  role="textbox"
  aria-multiline="true"
  [attr.aria-label]="locale.t('field.message')"
  [attr.contenteditable]="disabled() ? 'false' : 'true'"
  (input)="onInput()"
  (blur)="onBlur()"
  (paste)="onPaste($event)"
></div>
