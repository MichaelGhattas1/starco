<section class="panel mx-auto grid max-w-md gap-4 p-6">
  <p class="kicker">{{ locale.t('auth.account') }}</p>
  <h1 class="font-display text-5xl">{{ locale.t('auth.signIn') }}</h1>
  <p class="text-sm text-gold-200/80">{{ locale.t('auth.signInLead') }}</p>
  <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <label class="grid gap-1 text-sm">{{ locale.t('field.email') }}<input class="field" type="email" formControlName="email" autocomplete="username" /></label>
    <label class="grid gap-1 text-sm">{{ locale.t('field.password') }}<input class="field" type="password" formControlName="password" autocomplete="current-password" /></label>
    @if (error()) { <p class="text-red-200" role="alert">{{ error() }}</p> }
    <button class="btn btn-gold" type="submit" [disabled]="saving()">{{ saving() ? locale.t('action.signingIn') : locale.t('nav.signIn') }}</button>
  </form>
  <a routerLink="/forgot-password" class="text-sm underline">{{ locale.t('action.forgot') }}</a>
  <a class="text-sm underline" routerLink="/register" [queryParams]="accountQuery()">{{ locale.t('action.createAnAccount') }}</a>
</section>
