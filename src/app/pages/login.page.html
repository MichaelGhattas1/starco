<section class="panel mx-auto grid max-w-md gap-4 p-6">
  <p class="kicker">Account</p>
  <h1 class="font-display text-5xl">Sign in</h1>
  <p class="text-sm text-gold-200/80">Sign in to reserve a room. Admins can also create, update, and delete records.</p>
  <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <label class="grid gap-1 text-sm">Email<input class="field" type="email" formControlName="email" autocomplete="username" /></label>
    <label class="grid gap-1 text-sm">Password<input class="field" type="password" formControlName="password" autocomplete="current-password" /></label>
    @if (error()) { <p class="text-red-200" role="alert">{{ error() }}</p> }
    <button class="btn btn-gold" type="submit" [disabled]="saving()">{{ saving() ? 'Signing in…' : 'Sign in' }}</button>
  </form>
  <a routerLink="/forgot-password" class="text-sm underline">Forgot password</a>
  <a class="text-sm underline" routerLink="/register" [queryParams]="accountQuery()">Create an account</a>
</section>
