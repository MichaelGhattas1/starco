<section class="panel mx-auto max-w-xl p-6">
  <p class="kicker">Paymob</p>
  <h1 class="font-display text-5xl">Payment result</h1>
  <p class="mt-3" role="status">{{ loading() ? 'Checking payment…' : message() }}</p>
  @if (detail()) {
    <pre class="mt-4 overflow-auto rounded-2xl bg-navy-950 p-4 text-xs text-gold-200">{{ detail() }}</pre>
  }
  <label class="mt-5 grid gap-1 text-sm">
    Payment reference
    <input class="field" [value]="paymentRef()" (input)="onRef($event)" />
  </label>
  @if (unpaid().length) {
    <div class="mt-5 grid gap-2">
      <p class="text-sm text-gold-200">Other stays from your cart are reserved and still need payment.</p>
      @for (stay of unpaid(); track stay.encodedId) {
        <button type="button" class="btn btn-line" (click)="payStay(stay)" [disabled]="loading()">
          Pay {{ stay.label }}
        </button>
      }
    </div>
  }
  <button type="button" class="btn btn-gold mt-4" (click)="confirm()" [disabled]="loading()">Confirm payment</button>
  <a class="btn btn-line mt-3" routerLink="/hotels">Back to hotels</a>
</section>
